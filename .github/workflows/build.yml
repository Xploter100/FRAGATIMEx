name: Build FRAGATIME (Windows VST3)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/FRAGATIME_artefacts/Release/VST3/FRAGATIME.vst3 dist/FRAGATIME.vst3
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath FRAGATIME-win64-vst3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FRAGATIME-win64-vst3
          path: FRAGATIME-win64-vst3.zip

      - name: Publicar release (solo con tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FRAGATIME-win64-vst3.zip
